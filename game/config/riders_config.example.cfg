; Copy to config/riders_config.cfg; personal files are ignored by Git.
; Stable IDs must remain unchanged to retain each rider's records.
; Base profiles: tijdrijder CP 265 W, sprinter 240 W, aanvaller 250 W.
; Factors default to 1.0. Day form is 0.975..1.025; AI percentage keeps requested watts * percent / 80.
; Missing body fields retain the archetype body. Photos can be local paths or optional HTTPS URLs.
; Record times are seconds; absent/zero records are shown as unknown, never invented.
; The game uses this sample when no personal config exists. AI slots 14/15 use stable default entries.

