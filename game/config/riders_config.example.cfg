; Copy to config/riders_config.cfg; personal files are ignored by Git.
; Stable IDs must remain unchanged to retain each rider's records.
; Base profiles: tijdrijder CP 265 W, sprinter 240 W, aanvaller 250 W.
; Factors default to 1.0. Day form is 0.975..1.025; AI percentage keeps requested watts * percent / 80.
; prime: In de riders_config.cfg bepaalt w_prime_factor de anaerobe energiereserve van een renner: hoeveel extra energie hij kan leveren boven zijn Critical Power (CP). Het is dus vooral een maat voor hoe lang een renner zware inspanningen, aanvallen en sprints kan volhouden.
; Missing body fields retain the archetype body. Photos can be local paths or optional HTTPS URLs.
; Record times are seconds; absent/zero records are shown as unknown, never invented.
; Shared by standalone races and omnium. Category is men or women (default men).
; Omit country to use the national kit or a stable slot-based default.
; The game uses this sample when no personal config exists. Unconfigured standalone slots retain their defaults.

