; Full UV outfit (optional): skinsuit_png="res://assets/riders/national_kits/belgium/skinsuit.png"
; Empty/missing/invalid PNG uses original colors. Each rider has an independent setting.
; PNG paths may be res://, user://, absolute, or relative to the game directory.
; visor has exactly two options: "donker" or "doorzichtig". Omit to keep the original.
; helmet_png customizes the shell/center stripe independently (same path formats).
; [player] skinsuit_png / helmet_png select only the player. AI sections select individual riders.
; See assets/source_blender/SKINSUIT.md for atlas/build/import instructions.

[player]
skinsuit_png=""
helmet_png=""
visor="doorzichtig"

; Optional visual settings per rider: number (1-99), jersey_color, jersey_secondary, shorts_color, helmet_color.
; jersey_design: solid, stripes, hoops, diagonal, two_tone.
; COPY this file to riders_config.cfg next to project.godot.
; Keep your personal riders_config.cfg when extracting new updates.
; Rider numbers start at 01 and end at 11 (for 12 riders including you).
; The player name is set in Settings in the game.
; Valid profiles: tijdrijder, sprinter, aanvaller.
; Unspecified riders receive a default profile and generic name.
; These are optional example names, not official endorsements.

