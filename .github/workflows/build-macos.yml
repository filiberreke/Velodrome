name: Build macOS game

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.7 and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION=4.7
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -type f -path '*/Contents/MacOS/Godot' | head -n 1)"
          test -n "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Verify texture sources and clear import cache
        shell: bash
        run: |
          set -euo pipefail
          for texture in game/assets/textures/velodrome_wood_pine.png game/assets/textures/velodrome_cote_azur.png; do
            test -s "$texture"
            file "$texture"
            python3 - "$texture" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          if p.read_bytes()[:8] != bytes.fromhex('89504e470d0a1a0a'):
              raise SystemExit(f'Invalid PNG source (possible Git LFS pointer): {p}')
          PY
          done
          rm -rf game/.godot
      - name: Import project
        run: '"$GODOT_BIN" --headless --path game --editor --import --quit'
      - name: Export macOS
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path game --export-release "macOS" "../build/Velodrome.zip"
          test -s build/Velodrome.zip
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: Velodrome-macOS-unsigned
          path: build/Velodrome.zip
          if-no-files-found: error
