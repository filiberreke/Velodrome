name: Windows bundled game and bridge

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bundled:
    runs-on: windows-2022
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download existing validated Windows demo artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $runs = gh api "repos/$env:GH_REPO/actions/workflows/windows-demo.yml/runs?status=success&per_page=50" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve successful demo runs' }
          $selected = $null
          foreach ($candidate in $runs.workflow_runs) {
            $artifacts = gh api "repos/$env:GH_REPO/actions/runs/$($candidate.id)/artifacts?per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect artifacts for run $($candidate.id)" }
            if (@($artifacts.artifacts | Where-Object { $_.name -eq 'Velodrome-Demo-Windows-x64' -and -not $_.expired }).Count -gt 0) {
              $selected = $candidate.id
              break
            }
          }
          if (-not $selected) { throw 'No successful demo run with an available Windows artifact found' }
          Write-Host "Using latest successful demo build with available artifact: $selected"
          gh run download $selected --repo "$env:GH_REPO" --name Velodrome-Demo-Windows-x64 --dir bundled
          if ($LASTEXITCODE -ne 0) { throw 'Validated Windows demo artifact unavailable; run existing windows-demo workflow first' }
          if (!(Test-Path bundled/Velodrome.exe) -or !(Test-Path bundled/Velodrome.pck)) { throw 'Existing game export is incomplete' }
          foreach ($required in @('Initialize-Config.ps1','defaults/riders_config.cfg','defaults/strava_config.cfg')) {
            if (!(Test-Path (Join-Path bundled $required))) { throw "Existing demo config file missing: $required" }
          }
          Rename-Item bundled/Velodrome.exe VelodromeGame.exe
          Rename-Item bundled/Velodrome.pck VelodromeGame.pck
          # The bundled launcher is the only supported entry point.
          if (Test-Path bundled/Start-Velodrome.cmd) { Remove-Item bundled/Start-Velodrome.cmd -Force }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install bridge build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r bridge/requirements.txt 'pyinstaller>=6,<7'
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed' }

      - name: Package independent Python bridge
        shell: pwsh
        run: |
          # Destination '.' is relative to PyInstaller's _internal directory,
          # matching the bridge modules' Path(__file__).with_name(...) lookups.
          $dataArgs = @()
          foreach ($config in Get-ChildItem bridge -File -Filter '*.json') {
            # Absolute source paths also work when the spec lives in .build/.
            $dataArgs += @('--add-data', "$($config.FullName):.")
          }
          python -m PyInstaller --noconfirm --clean --onedir --contents-directory _internal --console --name VelodromeBridge --distpath bundled --workpath .build/bridge --specpath .build @dataArgs bridge/bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'Bridge packaging failed' }
          Move-Item bundled/VelodromeBridge bundled/bridge

      - name: Package single-entry launcher
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name Velodrome --distpath bundled --workpath .build/launcher --specpath .build packaging/windows-bundled/launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'Launcher packaging failed' }
          if (!(Test-Path bundled/Velodrome.exe)) { throw 'Launcher missing' }

      - name: Verify bundled file layout
        shell: pwsh
        run: |
          if (Test-Path bundled/Start-Velodrome.cmd) { throw 'Standalone start script must not be included in bundled release' }
          foreach ($file in @('Velodrome.exe','VelodromeGame.exe','VelodromeGame.pck','bridge/VelodromeBridge.exe','Initialize-Config.ps1')) {
            if (!(Test-Path (Join-Path bundled $file))) { throw "Missing bundled file: $file" }
          }
          foreach ($required in @('gear_config.json','simulation_config.json','button_mapping.json')) {
            if (!(Test-Path -PathType Leaf "bundled/bridge/_internal/$required")) { throw "Missing bridge configuration: $required" }
          }
          foreach ($config in Get-ChildItem bridge -File -Filter '*.json') {
            $packaged = Join-Path bundled/bridge/_internal $config.Name
            if (!(Test-Path -PathType Leaf $packaged)) { throw "Missing bundled JSON: $packaged" }
            if ((Get-FileHash $config.FullName).Hash -ne (Get-FileHash $packaged).Hash) { throw "Bundled JSON differs from source: $packaged" }
          }

      - name: Check frozen bridge configuration without hardware
        shell: pwsh
        run: |
          # Exercise actual frozen module paths from an unrelated working directory.
          $bridge = (Resolve-Path bundled/bridge/VelodromeBridge.exe).Path
          Push-Location $env:RUNNER_TEMP
          try {
            & $bridge --check-config
            if ($LASTEXITCODE -ne 0) { throw 'Frozen bridge configuration check failed' }
          } finally {
            Pop-Location
          }

      - name: Upload combined Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: Velodrome-Bundled-Windows-x64
          path: bundled/
          if-no-files-found: error
          retention-days: 14
