name: Windows bundled game and bridge

on:
  workflow_dispatch:
    inputs:
      demo_run_id:
        description: 'Successful run ID of existing Windows demo build (windows-demo.yml)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  bundled:
    runs-on: windows-2022
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download existing validated Windows demo artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DEMO_RUN_ID: ${{ inputs.demo_run_id }}
        run: |
          gh run download $env:DEMO_RUN_ID --repo "${{ github.repository }}" --name Velodrome-Demo-Windows-x64 --dir bundled
          if ($LASTEXITCODE -ne 0) { throw 'Validated Windows demo artifact unavailable; run existing windows-demo workflow first' }
          if (!(Test-Path bundled/Velodrome.exe) -or !(Test-Path bundled/Velodrome.pck)) { throw 'Existing game export is incomplete' }
          foreach ($required in @('Initialize-Config.ps1','defaults/riders_config.cfg','defaults/strava_config.cfg')) {
            if (!(Test-Path (Join-Path bundled $required))) { throw "Existing demo config file missing: $required" }
          }
          Rename-Item bundled/Velodrome.exe VelodromeGame.exe

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install bridge build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r bridge/requirements.txt 'pyinstaller>=6,<7'
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed' }

      - name: Package independent Python bridge
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name VelodromeBridge --distpath bundled --workpath .build/bridge --specpath .build bridge/bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'Bridge packaging failed' }
          Move-Item bundled/VelodromeBridge bundled/bridge
          Get-ChildItem bridge -Filter '*.json' | Copy-Item -Destination bundled/bridge

      - name: Package single-entry launcher
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name Velodrome --distpath bundled --workpath .build/launcher --specpath .build packaging/windows-bundled/launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'Launcher packaging failed' }
          if (!(Test-Path bundled/Velodrome.exe)) { throw 'Launcher missing' }

      - name: Verify bundled file layout
        shell: pwsh
        run: |
          foreach ($file in @('Velodrome.exe','VelodromeGame.exe','Velodrome.pck','bridge/VelodromeBridge.exe','Initialize-Config.ps1')) {
            if (!(Test-Path (Join-Path bundled $file))) { throw "Missing bundled file: $file" }
          }

      - name: Upload combined Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: Velodrome-Bundled-Windows-x64
          path: bundled/
          if-no-files-found: error
          retention-days: 14
